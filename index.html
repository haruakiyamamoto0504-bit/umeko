<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイフォトギャラリー</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --card-bg: rgba(20, 24, 39, 0.7);
            --accent-color: #FF00C4;
            --accent-hover: #e000ad;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 0, 196, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 150, 255, 0.08) 0%, transparent 40%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* ギャラリーのグリッドレイアウト */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .image-wrapper {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .item-info {
            padding: 16px;
        }

        .item-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* 拡大表示用モーダル */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            text-align: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 70vh;
            display: block;
            margin: 0 auto;
        }

        .modal-caption {
            padding: 16px;
            font-size: 1.1rem;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>My Photo Gallery</h1>
            <p>web server フォルダ内の写真を表示</p>
        </header>

        <div class="gallery-grid">
            <!-- umeko.jpg を表示するカード -->
            <div class="gallery-item" onclick="openModal('umeko.jpg', 'umeko.jpg', 'web server フォルダ内の画像')">
                <div class="image-wrapper">
                    <img src="umeko.jpg" alt="umeko">
                </div>
                <div class="item-info">
                    <div class="item-title">umeko.jpg</div>
                    <div class="item-desc">クリックして拡大表示</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 拡大表示用モーダル -->
    <div id="modal" onclick="closeModal()">
        <button class="close-btn">&times;</button>
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modal-img" src="" alt="">
            <div class="modal-caption" id="modal-caption"></div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalCaption = document.getElementById('modal-caption');

        function openModal(src, title, desc) {
            modalImg.src = src;
            modalCaption.innerHTML = `<strong>${title}</strong><br><span style="font-size:0.9rem; color:#9ca3af;">${desc}</span>`;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
